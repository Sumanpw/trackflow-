version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: trackflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Suman@2003
      MYSQL_DATABASE: delivery
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - trackflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pSuman@2003"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: trackflow-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/delivery?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Suman@2003
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - trackflow-network

volumes:
  mysql_data:

networks:
  trackflow-network:
    driver: bridge